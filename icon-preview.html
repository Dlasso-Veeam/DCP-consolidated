<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Securiti DS Icon Preview</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 32px; background: #f6f7f9; }
  h1 { font-size: 18px; margin-bottom: 24px; color: #1f2229; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .cell { background: #fff; border: 1px solid #e9e9ea; border-radius: 8px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile { width: 44px; height: 44px; border-radius: 8px; background: #fff; border: 1px solid #e9e9ea; display: flex; align-items: center; justify-content: center; color: #1ca8dd; }
  .tile svg { width: 22px; height: 22px; }
  .name { font-size: 11px; color: #444; text-align: center; word-break: break-word; line-height: 1.3; font-family: Menlo, monospace; }
</style>
</head>
<body>
<h1>Securiti DS icons — full roster</h1>
<div class="grid" id="grid"></div>
<script src="securiti-icons-data.js"></script>
<script>
  const names = Object.keys(window.__SECURITI_ICONS).sort();
  const grid = document.getElementById('grid');
  names.forEach(n => {
    const e = window.__SECURITI_ICONS[n];
    const paths = e.paths.map(d => `<path d="${d}" fill="currentColor" fill-rule="nonzero"/>`).join('');
    grid.insertAdjacentHTML('beforeend',
      `<div class="cell"><div class="tile"><svg viewBox="${e.viewBox}" fill="currentColor">${paths}</svg></div><div class="name">${n}</div></div>`
    );
  });
</script>
</body>
</html>
