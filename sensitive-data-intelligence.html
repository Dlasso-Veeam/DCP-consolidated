<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Data Explorer — Sanitize</title>
<style>
@font-face { font-family: 'Circular Pro'; src: url('fonts/CircularPro-Book.otf') format('opentype'); font-weight: 400; }
@font-face { font-family: 'Circular Pro'; src: url('fonts/CircularPro-Medium.otf') format('opentype'); font-weight: 500; }
@font-face { font-family: 'Circular Pro'; src: url('fonts/CircularPro-Bold.otf') format('opentype'); font-weight: 700; }

/* ═══ TOKENS — Veeam Vision (design-system-veeam-vision.md). Names follow the sibling pages (protected-data / identity-dashboard). ═══ */
:root {
  --green: #01804a;           /* Veeam Green/S80 — primary action */
  --green-70: #1a9e66;        /* S70 — hover */
  --green-90: #014c2c;        /* S90 — active */
  --green-40: #4dbd8e;        /* S40 — current-page chip stroke */
  --green-30: #9cd8be;        /* S30 — disabled primary */
  --green-20: #c6eddd;
  --green-10: #e4f6ee;        /* S10 — tiles, avatars */
  --green-5: #f6fbf9;         /* S5 — hover / selected wash, chip bg */
  --lime-30: #91f8b2;         /* rail active tile */
  --black-100: #1f2229;
  --black-90: #35383e;
  --black-80: #4c4e54;
  --black-70: #626469;        /* secondary text */
  --black-60: #797a7f;        /* Black/S60 — summary row labels */
  --black-50: #8f9094;
  --black-30: #bcbdbf;        /* disabled text */
  --black-20: #d2d3d4;        /* borders */
  --black-10: #e9e9ea;
  --black-5: #f8f8f9;
  --form-bg: #f8f8f8;         /* Veeam Form BG */
  --surface: #f4f6f8;         /* explorer surface behind the white cards (live product) */
  --green-50: #3cb783;        /* Veeam Green/S50 — filter-add ring */
  --white: #ffffff;
  --red: #ed2c3d;             /* Ignis/S50 */
  --red-10: #fde8e9;
  --red-30: #f58a93;
  --red-40: #f15b68;
  --orange-10: #fef1ea;
  --orange-border: #f89256;   /* Alerts set, warning border */
  --gold-bg: #fcf8ea;
  --gold-fg: #9d7f17;
  --kpi-accent: #a745a9;      /* KPI tile bar — live product value (nearest DS style: Base/Plum #98269b) */
  --ai-grad: conic-gradient(from 90deg, #5bbc7b 0deg, #119ee7 57.6deg, #d83dcf 153deg, #ee6b36 234deg, #8fd131 320.4deg, #5bbc7b 360deg); /* Veeam AI brand gradient (same as protected-data) */
  --nav-dark: #1f2229;
  --nav-icon-bg: #35383e;
  --focus-ring: 0 0 0 2px #ffffff, 0 0 0 4px #008436;
  --r-xs: 2px; --r-sm: 4px; --r-md: 8px;
  --scrim: rgba(31, 34, 41, 0.4);
  --shadow-lg: 0 12px 32px rgba(28, 32, 41, 0.18);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { min-width: 1320px; } /* the live explorer supports 1320px minimum — not responsive below that */
body { font-family: 'Circular Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 22px; font-weight: 400; color: var(--black-100); background: var(--layout-bg); display: flex; }
button { font: inherit; color: inherit; }
svg { display: block; flex-shrink: 0; }

/* ═══ Page chrome — measured live (Universal Data Explorer, 1440 viewport) ═══ */
html { min-width: 1320px; }
body { background: var(--white); }
.sidenav { width: 72px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; position: fixed; left: 0; top: 0; bottom: 0; background: var(--nav-dark); z-index: 50; }
.sidenav-logo { height: 72px; width: 72px; flex-shrink: 0; overflow: hidden; }
.sidenav-logo svg { display: block; }
.rail-menu { width: 40px; height: 40px; margin-top: 24px; padding: 0; border: none; border-radius: 8px; background: var(--nav-icon-bg); color: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.rail-menu svg, .rail-module svg { width: 24px; height: 24px; }
.rail-module { width: 40px; height: 40px; margin-top: 40px; border-radius: 8px; background: var(--green); color: var(--white); display: flex; align-items: center; justify-content: center; }
.rail-module svg { width: 32px; height: 32px; }
.rail-stack { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.nav-btn { width: 32px; height: 32px; padding: 0; border: none; border-radius: 8px; background: var(--nav-icon-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--white); flex-shrink: 0; }
.nav-btn:hover { background: var(--black-80); }
.nav-btn.active { background: var(--lime-30); color: var(--black-100); }
.nav-btn svg { width: 24px; height: 24px; }
.rail-bottom { margin-top: auto; padding-bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.rail-ai { width: 40px; height: 40px; border-radius: 50%; background: var(--ai-grad); display: flex; align-items: center; justify-content: center; color: var(--white); border: none; padding: 0; }
.nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: #284fb8; color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }

.main { margin-left: 72px; padding: 16px 24px 18px; min-width: 1248px; }
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.breadcrumbs { display: flex; align-items: center; gap: 4px; height: 20px; margin-bottom: 8px; font-size: 14px; line-height: 20px; color: var(--black-70); }
.breadcrumbs svg { width: 16px; height: 16px; }
.breadcrumbs .sep { display: flex; color: var(--black-30); }
.page-title { font-size: 24px; line-height: 24px; font-weight: 500; letter-spacing: -0.02em; margin: 0; padding-bottom: 3.6px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.btn { height: 36px; padding: 0 12px; border-radius: 4px; border: 1px solid transparent; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; white-space: nowrap; font-weight: 400; }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--green); color: var(--white); font-weight: 500; }
.btn-primary:hover { background: var(--green-70); }
.btn-primary:active { background: var(--green-90); }
.btn-primary:disabled { background: var(--green-30); cursor: default; }
.btn-secondary { background: var(--white); border-color: transparent; box-shadow: inset 0 0 0 1px var(--black-20); }
.btn-secondary:hover { background: var(--black-5); color: var(--black-80); }
.btn-secondary:active { background: var(--black-10); }
.btn-secondary:disabled { color: var(--black-30); box-shadow: inset 0 0 0 1px var(--black-10); background: var(--white); cursor: default; }
.btn-flat:hover:not(:disabled) { color: var(--black-80); }
.btn-flat:active:not(:disabled) { background: var(--black-10); }
.btn-flat:disabled { color: var(--black-30); cursor: default; background: none; }
.btn-tertiary { background: var(--green-5); border-color: var(--green-50); color: var(--green); }
.btn-tertiary:hover { background: var(--green-10); }
/* Vision Button, Type=Tertiary Size=Small: label Body/B2/Normal (16/22, 450), side padding 4 */
.btn-tertiary.btn-sm { padding: 0 4px; font-size: 16px; line-height: 22px; font-weight: 450; }
.btn-sm { height: 28px; padding: 0 8px; }
.btn-icon { width: 36px; padding: 0; }
.btn:focus-visible, .cb:focus-visible, .sw:focus-visible, .li:focus-visible, .row-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* page content box: 1px #e9e9ea, r4; panels stack flush, separated only by 1px lines */
.page-content { border: 1px solid var(--black-10); border-radius: 4px; }
.filter-row { padding: 12px; min-height: 60px; border-bottom: 1px solid var(--black-10); }
.filter-in { display: flex; align-items: center; gap: 8px; min-height: 36px; flex-wrap: wrap; }
.filter-add { width: 36px; height: 36px; padding: 0; border: none; background: var(--green-5); color: var(--green); border-radius: 4px; box-shadow: inset 0 0 0 1px var(--green-50); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.filter-add:hover { background: var(--green-10); }
.filter-hint { color: var(--black-70); padding: 0 24px 0 0; }
/* Chip — Veeam Vision component set (72bd3895…), read live from Figma. ALWAYS build chips with chip() below; never write chip markup by hand.
   Size: Default 28 only (pad 3/4, Body/B2/Semi Bold 16/22). Radius 2. This product does not use the Small (24) or Mini (20) sizes.
   Mode: Light = no stroke · Outline = 1px stroke. Type sets fill + text. */
.chip { display: inline-flex; align-items: center; gap: 4px; box-sizing: border-box; height: 28px; padding: 3px 4px; border-radius: 2px; background: var(--black-5); color: var(--black-100); font-size: 16px; line-height: 22px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.chip.green { background: var(--green-5); color: var(--green); }
.chip.red { background: var(--red-10); color: var(--red); }
.chip.gold { background: var(--gold-bg); color: var(--gold-fg); }
.chip.outline { box-shadow: inset 0 0 0 1px var(--black-50); }
.chip.green.outline { box-shadow: inset 0 0 0 1px var(--green-70); }
.chip.red.outline { box-shadow: inset 0 0 0 1px var(--red-30); }
.chip.gold.outline { box-shadow: inset 0 0 0 1px #c49f1d; }
.chip button { border: none; background: none; padding: 0; cursor: pointer; color: inherit; display: flex; }
.chip svg { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }   /* chips wrap inside their cell — never clipped */

.kpis { display: flex; gap: 1px; background: var(--black-10); margin-bottom: 1px; }
.kpi { flex: 1 1 0; background: var(--white); border-radius: 2px; padding: 12px; height: 92px; min-width: 0; }
.kpi-in { height: 68px; padding-left: 16px; box-shadow: inset 4px 0 0 var(--kpi-accent); display: flex; flex-direction: column; justify-content: center; }
.kpi-label { display: flex; align-items: center; gap: 4px; height: 28px; margin-bottom: 8px; color: var(--black-70); white-space: nowrap; }
.kpi-label .chev { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
.kpi-label svg { width: 20px; height: 20px; }
.kpi-value { font-size: 32px; line-height: 32px; font-weight: 500; letter-spacing: -0.64px; font-variant-numeric: tabular-nums; color: var(--black-100); }

/* explorer: #f4f6f8 surface with two white cards and a 1px seam */
.explorer { position: relative; display: flex; background: var(--surface); border-radius: 2px; height: calc(100vh - 261px); min-height: 480px; border-top: 1px solid var(--black-10); }
.tree-card { width: 319px; flex-shrink: 0; background: var(--white); border-radius: 2px; display: flex; flex-direction: column; min-height: 0; margin-right: 1px; }
.explorer.collapsed .tree-card { display: none; }
.collapse-btn { position: absolute; left: 312px; top: 44px; width: 16px; height: 32px; padding: 0; border: none; border-radius: 16px; background: var(--white); box-shadow: inset 0 0 0 1px var(--black-20); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; color: var(--black-100); }
.explorer.collapsed .collapse-btn { left: -8px; }
.collapse-btn svg { width: 16px; height: 16px; transform: rotate(90deg); }
.explorer.collapsed .collapse-btn svg { transform: rotate(-90deg); }
.tree-hd { padding: 12px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
.graph-btn { width: 100%; }
.sfield { position: relative; }
.sfield input { width: 100%; height: 36px; border: none; border-radius: 4px; background: var(--form-bg); box-shadow: inset 0 0 0 1px var(--black-20); padding: 0 12px; font: inherit; color: var(--black-100); }
.sfield input::placeholder { color: var(--black-50); }
.sfield input:focus { outline: none; background: var(--green-5); box-shadow: inset 0 0 0 1px var(--green); }
.sfield.lead input { padding-left: 40px; }
.sfield.trail input { padding-right: 40px; }
.sfield > span { position: absolute; top: 8px; width: 20px; height: 20px; display: flex; color: var(--black-100); pointer-events: none; }
.sfield.lead > span { left: 8px; }
.sfield.trail > span { right: 8px; }
.tree-list { flex: 1; overflow-y: auto; min-height: 0; }
.tree-group-h { display: flex; align-items: center; gap: 8px; height: 44px; padding: 12px; width: 100%; border: none; background: var(--white); text-align: left; cursor: pointer; font: inherit; color: var(--black-100); line-height: 20px; }
.tree-group-h .gchev { width: 20px; height: 20px; border-radius: 4px; background: var(--green-10); color: var(--green); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .15s; }
.tree-group-h .gchev svg { width: 20px; height: 20px; }
.tree-group.closed .gchev { transform: rotate(-90deg); }
.tree-group.closed .tree-items { display: none; }
.tree-items { margin-left: 24px; }
.li { display: flex; align-items: center; gap: 8px; height: 44px; padding: 8px 12px; border: none; background: var(--white); width: 100%; text-align: left; cursor: pointer; border-radius: 0; font: inherit; color: var(--black-100); line-height: 22px; }
.li:hover { background: var(--green-5); }
.li.is-active { background: var(--green-5); box-shadow: inset 2px 0 0 var(--green); color: var(--green); font-weight: 500; }
.li .tile { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.li .tile svg { width: 16px; height: 16px; }
.li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .count { height: 28px; min-width: 33.6px; padding: 0 4px; border-radius: 2px; background: var(--green-5); color: var(--green); font-size: 13px; line-height: 28px; font-weight: 400; text-align: center; font-variant-numeric: tabular-nums; }
.li.is-active .count { background: var(--green); color: var(--white); }

.content-card { flex: 1; min-width: 0; background: var(--white); border-radius: 2px; display: flex; flex-direction: column; min-height: 0; }
.entity-hd { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.entity-row { display: flex; align-items: center; gap: 16px; }
.entity-tile { width: 52px; height: 52px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.entity-tile svg { width: 32px; height: 32px; }
.entity-title { font-size: 18px; line-height: 24px; letter-spacing: -0.09px; }
.entity-desc { color: var(--black-70); }
hr.line { border: none; border-top: 1px solid var(--black-10); margin: 0; flex-shrink: 0; }
.mini-kpis { display: flex; flex-shrink: 0; }
.mkpi { flex: 1 1 0; background: var(--white); border-radius: 2px; padding: 12px; height: 84px; min-width: 0; }
.mkpi + .mkpi { box-shadow: inset 1px 0 0 var(--black-10); }
.mkpi-top { display: flex; align-items: center; height: 28px; color: var(--black-70); font-size: 14px; line-height: 20px; }
.mkpi-top .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mkpi-top .chev { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
.mkpi-top svg { width: 20px; height: 20px; }
.mkpi-v { font-size: 24px; line-height: 32px; font-variant-numeric: tabular-nums; }

/* bulk action bar (52, pad 8/16, gap 8, 0 1px 0 #edf0f0) */
.bulk { display: flex; align-items: center; gap: 8px; height: 52px; padding: 8px 16px; background: var(--white); box-shadow: 0 1px 0 #edf0f0; flex-shrink: 0; position: relative; z-index: 4; }
.bulk-sp { flex: 1; }
.tip { position: relative; display: inline-flex; }

/* grid: th 14/20 black-70 pad 8 + 1px #f4f6f8 underline; td 16/22 pad 0 8, row 48; no row hairlines */
.table-wrap { overflow: auto; flex: 1; min-height: 0; border-radius: 0 0 2px 2px; }
table { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--white); height: 40px; padding: 8px; text-align: left; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--black-70); white-space: nowrap; border-bottom: 1px solid var(--surface); }
thead th.sortable { cursor: pointer; }
thead th .sort { display: inline-flex; vertical-align: middle; margin-left: 4px; opacity: 0; }
thead th:hover .sort, thead th.sorted .sort { opacity: 1; }
thead th .sort svg { width: 16px; height: 16px; }
tbody td { height: 48px; padding: 0 8px; background: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tbody tr:hover td { background: var(--green-5); }
tbody tr.is-selected td { background: var(--green-5); }
tbody tr.is-ineligible td:not(.cb-col):not(.gut) { color: var(--black-70); }
th.gut, td.gut { width: 48px; min-width: 48px; position: sticky; left: 0; z-index: 3; padding: 0 8px 0 16px; }
th.cb-col, td.cb-col { width: 76px; min-width: 76px; position: sticky; left: 48px; z-index: 3; padding: 0 8px; }
thead th.gut, thead th.cb-col { z-index: 5; }
td.act, th.act { position: sticky; right: 0; z-index: 3; width: 72px; min-width: 72px; text-align: right; }
.gut-btns { display: none; flex-direction: column; gap: 0; }
tbody tr:hover .gut-btns { display: flex; }
.row-btn { width: 24px; height: 24px; padding: 0; border: none; background: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--black-100); }
.row-btn:hover { background: var(--black-10); }
.row-btn svg { width: 16px; height: 16px; }
.act-in { display: flex; justify-content: flex-end; }
.act-in .row-btn { width: 28px; height: 28px; }
.act-in .row-btn svg { width: 20px; height: 20px; }
.cell-flex { display: flex; align-items: center; gap: 8px; }
.av { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.av img { width: 20px; height: 20px; display: block; }
.fico { width: 28px; height: 28px; border-radius: 4px; background: var(--surface); color: var(--black-70); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fico svg { width: 20px; height: 20px; }
.muted { color: var(--black-50); }

/* checkbox — Vision Selection: 16px shape, Green/S80, r4 */
.cb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; border: 2px solid var(--green); border-radius: 4px; background: var(--white); cursor: pointer; position: relative; display: block; }
.cb:checked, .cb:indeterminate { background: var(--green); }
.cb:checked::after { content: ''; position: absolute; left: 3px; top: -1px; width: 4px; height: 8px; border: solid var(--white); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cb:indeterminate::after { content: ''; position: absolute; left: 2px; top: 5px; width: 8px; height: 2px; background: var(--white); }
.cb-head { display: flex; align-items: center; gap: 0; }
.cb-caret { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: 4px; padding: 0; border: 0; border-radius: 4px; background: var(--black-5); color: var(--black-100); cursor: pointer; flex-shrink: 0; }
.cb-caret:hover { background: var(--black-10); }
.cb-caret svg { width: 20px; height: 20px; }
.cb-caret:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.cbw { display: inline-flex; }
/* header-checkbox menu — same recipe as protected-data (.dx-bm / .dx-mi / .dx-md) */
.dx-bm { position: fixed; z-index: 3200; min-width: 260px; max-width: 360px; padding: 4px 0; background: var(--white); border: 1px solid var(--black-20); border-radius: 4px; box-shadow: 0 8px 24px rgba(31,34,41,.16); }
.dx-mi { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 10px 16px; border: 0; background: transparent; text-align: left; font-family: inherit; font-size: 16px; line-height: 22px; color: var(--black-100); cursor: pointer; }
.dx-mi:hover:not(:disabled) { background: var(--black-5); }
.dx-mi:disabled { color: var(--black-30); cursor: default; }
.dx-md { height: 1px; margin: 4px 0; background: var(--black-10); }
/* Toast — the shared component (protected-data / activity): anchored top-right, above modals, title + optional body/action, type-tinted surface */
.toast { position: fixed; top: 16px; right: 24px; max-width: 420px; min-width: 320px; border: 1px solid; border-radius: 8px; padding: 16px 18px; display: flex; gap: 16px; align-items: flex-start; z-index: 10000; box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-12px); opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.toast.toast-success { background: var(--green-5); border-color: var(--green-30); }
.toast-content { flex: 1; min-width: 0; }
.toast-title { font-size: 16px; font-weight: 500; color: var(--black-100); line-height: 1.4; }
.toast-body { font-size: 14px; color: var(--black-100); line-height: 1.5; margin-top: 4px; }
.toast-body a { color: var(--green); text-decoration: underline; cursor: pointer; }
.toast-close { background: none; border: none; padding: 0; cursor: pointer; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
.toast-close svg { width: 16px; height: 16px; display: block; stroke-width: 2.5; }
.toast.toast-success .toast-close { color: var(--green); }
#ttip { position: fixed; z-index: 4000; display: none; max-width: 260px; padding: 6px 9px; border-radius: 4px; background: var(--white); color: var(--black-100); border: 1px solid var(--black-10); box-shadow: 0 4px 14px rgba(0, 0, 0, .22); font-size: 14px; line-height: 1.35; font-weight: 450; pointer-events: none; }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 16px; height: 52px; padding: 0 16px; color: var(--black-70); font-size: 14px; flex-shrink: 0; background: var(--white); }
.pager select { height: 28px; border: none; box-shadow: inset 0 0 0 1px var(--black-20); border-radius: 4px; background: var(--form-bg); font: inherit; padding: 0 4px; }

<script>
(function() {
  'use strict';
  const AUTH_ENABLED = true;
  if (!AUTH_ENABLED) {
    document.getElementById('passwordGate').style.display = 'none';
    window._bde_auth = { check: function(){} };
    return;
  }
  const _H = '550710b486683d01b285474d6bbb84c48c2d3df1231e6dc9bbb853e433cc1b13';
  const _S = [0x9f,0x4a,0x2c,0x8e,0x1b,0x7d,0x30,0x56,0xa5,0xf2,0xe9,0xc4,0xb8,0xd1,0xf7,0xe3];

  const SESSION_KEY = '_sw_s';
  const LOCKOUT_KEY = '_sw_l';
  const SESSION_TTL = 8*60*60*1000;
  const MIN_DELAY_MS = 1500;
  const MAX_ATTEMPTS = 5;
  const LOCKOUT_TIERS = [30000,120000,600000,3600000,86400000];
  function isAuthenticated() {
    try {
      const raw = (localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY));
      if (!raw) return false;
      const {token,expires} = JSON.parse(raw);
      if (Date.now() > expires) { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); return false; }
      return token === _H.slice(0,16) + String(expires);
    } catch(e) { return false; }

    const expires = Date.now() + SESSION_TTL;
    localStorage.setItem(SESSION_KEY, JSON.stringify({token:_H.slice(0,16)+String(expires),expires}));

  function getLockout() {
    try { return JSON.parse(localStorage.getItem(LOCKOUT_KEY)) || {attempts:0,until:0}; }
    catch(e) { return {attempts:0,until:0}; }
  }
  function saveLockout(s) { localStorage.setItem(LOCKOUT_KEY, JSON.stringify(s)); }
  function recordFailure() {
    const s = getLockout(); s.attempts++;
    if (s.attempts >= MAX_ATTEMPTS) { s.until = Date.now() + LOCKOUT_TIERS[Math.min(s.attempts-MAX_ATTEMPTS, LOCKOUT_TIERS.length-1)]; }
    saveLockout(s); return s;
  }
  function recordSuccess() { localStorage.removeItem(LOCKOUT_KEY); }
  async function deriveHash(pw) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new Uint8Array(_S),iterations:_I},km,256);

  function setLoading(on) { const b=document.getElementById('pwBtn'),i=document.getElementById('pwInput'); b.disabled=on; i.disabled=on; b.style.opacity=on?'0.6':'1'; b.style.cursor=on?'not-allowed':'pointer'; b.textContent=on?'Verifying\u2026':'Continue'; }
  function showLockout(until) {
    const i=document.getElementById('pwInput'),b=document.getElementById('pwBtn'); i.disabled=true; b.disabled=true; b.style.opacity='0.6'; b.style.cursor='not-allowed';
    function tick() { const s=Math.ceil((until-Date.now())/1000); if(s<=0){i.disabled=false;b.disabled=false;b.style.opacity='1';b.style.cursor='pointer';b.textContent='Continue';clearError();i.focus();return;} const m=Math.floor(s/60),r=s%60,l=m>0?m+'m '+r+'s':r+'s'; setError('Too many attempts. Try again in '+l+'.'); b.textContent='Locked ('+l+')'; setTimeout(tick,1000); }
    tick();
  }
  async function check() {
    const lo=getLockout(); if(lo.until>Date.now()){showLockout(lo.until);return;}
    const val=document.getElementById('pwInput').value; if(!val){setError('Please enter the password.');return;}
    setLoading(true); clearError(); const t0=Date.now();
    let hash; try{hash=await deriveHash(val);}catch(e){setLoading(false);setError('Verification failed.');return;}

  else{const lo=getLockout();if(lo.until>Date.now())showLockout(lo.until);else document.getElementById('pwInput').focus();}
  window._bde_auth = {check};

/* ═══ Job ═══ */
function startJob() {
  var W = S.wiz, id = 'SAN-' + (2041 + Math.floor(Math.random() * 40)), items = W.items.slice();
  W.step = 3; W.job = { id: id };
  /* Hand the job to the Activity page (Sanitize jobs view), the same way restore sessions reach it through 'dcc-jobs-bridge'. runForMs matches the
     4s this prototype takes to show the sanitized-copy chip on the rows below, so both pages agree on when the job finishes. */
  try {
    var n = items.length, on = W.conds.filter(function (c) { return c.on; }).length, L = JSON.parse(localStorage.getItem('dcc-sanitize-bridge')) || [];
    L = L.filter(function (x) { return x.id !== id; });
    L.unshift({ id: id, kind: W.isF ? 'Files' : 'Data systems', items: W.all ? 'All matching ' + (W.isF ? 'files' : 'data systems') : n + ' ' + (W.isF ? (n === 1 ? 'file' : 'files') : (n === 1 ? 'data system' : 'data systems')),
      files: W.files, conds: on, condsTotal: W.conds.length, ocr: W.ocr, stt: W.stt, path: W.path, startedTs: Date.now(), runForMs: 4000, initiator: 'Darren Lasso' });
    localStorage.setItem('dcc-sanitize-bridge', JSON.stringify(L.slice(0, 40)));
  } catch (e) {}
  // The wizard doesn't follow progress (that would hold the admin here): like a restore job, the work moves to Activity.
  // Prototype: the job finishes in the background and the explorer rows pick up the sanitized-copy chip.
  setTimeout(function () {
    items.forEach(function (it) { if (it.all) { rows().forEach(function (o) { S.sanitized[o.k] = id; }); } else S.sanitized[it.k] = id; });
    renderGrid();
  }, 4000);
  renderWiz();
  document.querySelector('.wiz-scroll').scrollTop = 0;   // the started alert is at the top of the Summary
  showToast('Sanitize job started', { body: 'It runs in the background.', action: { label: 'View job', onClick: function () { window.location.href = 'activity.html#sanitize/' + id; } } });
}

/* ═══ Toast (same API as the shared showToast: showToast('Title', { body, action: { label, onClick } })) ═══ */
function showToast(msg, opts) {
  var t = document.getElementById('toast'); if (!t) return;
  opts = opts || {};
  document.getElementById('toastTitle').textContent = msg || '';
  var bodyEl = document.getElementById('toastBody');
  if (opts.body || (opts.action && opts.action.label)) {
    bodyEl.innerHTML = opts.body || '';
    if (opts.action && opts.action.label) {
      var lnk = document.createElement('a'); lnk.href = '#'; lnk.textContent = opts.action.label;
      if (opts.body) { lnk.style.marginLeft = '8px'; lnk.style.fontWeight = '500'; }
      lnk.onclick = function (ev) { ev.preventDefault(); if (opts.action.onClick) opts.action.onClick(); };
      bodyEl.appendChild(lnk);
    }
    bodyEl.style.display = '';
  } else { bodyEl.innerHTML = ''; bodyEl.style.display = 'none'; }
  t.classList.add('show');
  var dwell = (opts.body || opts.action) ? 6000 : 3000;
  if (showToast._hideTimer) clearTimeout(showToast._hideTimer);
  showToast._hideTimer = setTimeout(function () { t.classList.remove('show'); showToast._hideTimer = null; }, dwell);
}
function hideToast() {
  var t = document.getElementById('toast'); if (t) t.classList.remove('show');
  if (showToast._hideTimer) { clearTimeout(showToast._hideTimer); showToast._hideTimer = null; }
}

renderRail(); renderAll();
</script>
