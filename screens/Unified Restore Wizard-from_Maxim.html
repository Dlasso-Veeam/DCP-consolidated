<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Unified Restore Wizard</title>
<style>
:root{
  --green:#01804A; --green-hover:#016B3E; --green-soft:#F6FBF9; --green-line:#A9DCC4; --green-mid:#1A9E66;
  --ink:#1F2229; --ink-2:#35383E; --ink-3:#626469; --ink-4:#9B9DA1;
  --line:#D2D3D4; --line-2:#E9E9EA; --bg-soft:#F8F8F9;
  --amber:#E2620F; --amber-soft:#FEF1EA; --amber-line:#FBCDB3;
  --red:#ED2C3D; --blue:#1CA8DD; --blue-soft:#F3FAFD;
  --radius:4px;
  --font:"Circular Pro","Circular Std",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-title:"ITC Avant Garde Gothic Std","ITC Avant Garde Gothic","Avant Garde",var(--font);
  --page:1600px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.5;background:#fff;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.shell{display:flex;flex-direction:column;height:100vh;background:#fff}
.hdr{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-shrink:0}
.hdr .bk,.hdr .ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0}
.hdr .bk:hover,.hdr .ib:hover{background:var(--bg-soft)}
.hdr .bk svg,.hdr .ib svg{width:15px;height:15px}
.hdr h1{font-size:20px;font-weight:500;letter-spacing:-.2px}
.hdr .sep{color:var(--ink-4)}
.hdr .wl{font-size:20px;font-weight:500}
.hdr .grow{flex:1}
.body{flex:1;display:flex;min-height:0}
.side{width:276px;flex-shrink:0;padding:26px 16px;border-right:1px solid var(--line-2);overflow:auto}
.side .lbl{font-size:12px;color:var(--ink-3);padding:0 10px 12px}
.step{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;font-size:16px;color:var(--ink-2);margin-bottom:2px;cursor:pointer;position:relative}
.step:hover{background:var(--bg-soft)}
.step .sq{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line);color:var(--ink-4);background:#fff}
.step .sq svg{width:13px;height:13px}
.step.on{background:var(--green-soft);color:var(--green);font-weight:500}
.step.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
.step.on .sq{background:var(--green);border-color:var(--green);color:#fff}
.step.done .sq{border-color:var(--green-line);color:var(--green)}
.step.done{color:var(--ink)}
.main{flex:1;overflow:auto;padding:30px 40px 40px}
.col{width:100%;max-width:var(--page);margin:0 auto}
.col.narrow{max-width:660px}
h2.ttl{font-size:20px;font-weight:500;margin-bottom:4px;letter-spacing:-.1px}
p.lead{font-size:16px;color:var(--ink-2);margin-bottom:22px}
.sect{margin-top:26px}
.sect:first-of-type{margin-top:0}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:3px}
.shead h3{font-size:16px;font-weight:500}
.shelp{font-size:14px;color:var(--ink-3);margin-bottom:12px}
.optchip{font-size:12px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-3);background:var(--bg-soft);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:6px}
.p1chip{font-size:12px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:#6B4E9E;background:#F3EFFA;border:1px solid #DDD1F0;border-radius:4px;padding:1px 6px;white-space:nowrap}
.lk{border:0;background:transparent;color:var(--green);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:2px;padding:0}
.lk:disabled{color:var(--ink-4);cursor:default;text-decoration:none}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:9px 15px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--bg-soft)}
.btn svg{width:15px;height:15px}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.btn.green:hover{background:var(--green-hover);border-color:var(--green-hover)}
.btn.green:disabled{background:#B9DCC9;border-color:#B9DCC9;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.srch{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--radius);padding:8px 13px}
.srch:focus-within{border-color:var(--green);background:#fff}
.srch svg{width:15px;height:15px;color:var(--ink-3);flex-shrink:0}
.srch input{border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;width:100%;color:var(--ink)}
.srch input::placeholder{color:var(--ink-4)}
.none{padding:10px;font-size:14px;color:var(--ink-3)}
.tblhead{display:flex;align-items:flex-end;gap:18px;margin-bottom:12px}
.tblhead .l{flex:1;min-width:0}
.tblhead h3{font-size:16px;font-weight:500;margin-bottom:3px}
.tblhead .shelp{margin-bottom:0}

/* platform filter bar */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;min-height:34px}
.addf{width:34px;height:34px;border:1px solid var(--green);border-radius:6px;background:#fff;color:var(--green);font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.addf:hover,.addf.on{background:var(--green-soft);box-shadow:0 0 0 2px var(--green-line)}
.fbar .fhint{color:var(--ink-4)}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--green-line);background:var(--green-soft);border-radius:16px;padding:4px 6px 4px 11px}
.fchip .fcx{border:0;background:transparent;color:var(--green);font-weight:500;font-size:14px;padding:0;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip .x{border:0;background:transparent;color:var(--green);font-size:16px;line-height:1;width:16px;height:16px;border-radius:50%;padding:0}
.fchip .x:hover{background:#D5EFE1}
.fpx{position:fixed;z-index:70;width:620px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(20,22,40,.16);display:flex;flex-direction:column}
.fpx-s{padding:6px}
.fpx-s .srch{background:#fff;padding:9px 13px}
.fpx-b{display:flex;height:330px;max-height:55vh;border-top:1px solid var(--line-2)}
.fpx-l{width:230px;flex-shrink:0;border-right:1px solid var(--line-2);padding:10px 8px;overflow:auto}
.fpx-lh{font-size:14px;color:var(--ink-3);padding:2px 10px 6px}
.pi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;font-size:16px;cursor:pointer;border:1px solid transparent;margin-bottom:1px}
.pi:hover{background:var(--bg-soft)}
.pi.on{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.pi .bd{background:var(--green);color:#fff;font-size:12px;font-weight:500;border-radius:4px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.fpx-r{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:9px;overflow:auto}
.pxt{display:flex;align-items:center;font-weight:500;font-size:16px}
.pxt .lk{margin-left:auto}
.selw{position:relative}
.selw select{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg-soft);padding:8px 30px 8px 11px;font:16px var(--font);color:var(--ink);cursor:pointer}
.selw select:focus{outline:none;border-color:var(--green);background:#fff}
.selw::after{content:"";position:absolute;right:12px;top:50%;margin-top:-2px;border:4.5px solid transparent;border-top-color:var(--ink-2);pointer-events:none}
.pxin{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 11px;font:16px var(--font);color:var(--ink);outline:none}
.pxin:focus{border-color:var(--green)}
.pxin::placeholder{color:var(--ink-4)}
.pxh{font-size:12px;color:var(--ink-3)}
.pxv{border:1px solid var(--line-2);border-radius:6px;padding:4px;overflow:auto;flex:1;min-height:90px}
.pxv .fi{padding:6px 8px;font-size:14px}
.fpx-f{display:flex;gap:10px;padding:10px;border-top:1px solid var(--line-2)}
.fpx-f .btn{min-width:90px}
.fpx-f .btn.green{flex:1}
.fi{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:16px}
.fi:hover{background:var(--bg-soft)}
.fi input{position:absolute;opacity:0;pointer-events:none}
.fi .ck{width:17px;height:17px;border-radius:4px;border:1.5px solid #BDBDBD;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.fi .ck svg{width:11px;height:11px}
.fi.on .ck{background:var(--green);border-color:var(--green);color:#fff}
.fi .n{margin-left:auto;font-size:12px;color:var(--ink-4)}

/* records × chosen columns */
.mx{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mxscroll{overflow-x:auto}
.mxv{border-collapse:separate;border-spacing:0;width:100%}
.mxv th,.mxv td{padding:9px 14px;font-size:14px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;background:#fff;vertical-align:middle}
.mxv thead th{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-3)}
.mxv .c-rec{position:sticky;left:0;z-index:1;width:1%;box-shadow:1px 0 0 var(--line-2)}
.mxv .c-rp{width:1%}
.mxv thead .c-rec{z-index:3}
.mxv tbody tr:last-child td{border-bottom:0}
.mxv tbody tr:hover td{background:#FCFCFD}
.mxv .rcell{display:flex;align-items:center;gap:10px}
.mxv .rn{font-weight:500;color:var(--ink)}
.mxv .fh{display:inline-flex;align-items:center;gap:7px}
.mxv .ctag{font-size:12px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-3);background:var(--bg-soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.mxv .nofld{color:var(--ink-4);font-style:italic}
.mxv tr.off .rn,.mxv tr.off .fcell,.mxv tr.off .rpsel{opacity:.45}
.mxv td.nomatch{white-space:normal;color:var(--ink-3);padding:26px 14px;text-align:center}
.fcell{display:inline-flex;align-items:center;gap:7px}
.fcell svg{width:14px;height:14px;color:var(--ink-4);flex-shrink:0}
.fcell .fn{color:var(--ink)}
.fcell .fs{color:var(--ink-4)}
.rck{display:inline-flex;cursor:pointer;flex-shrink:0}
.rck input{position:absolute;opacity:0;pointer-events:none}
.rck .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid #BDBDBD;background:#fff;display:flex;align-items:center;justify-content:center;color:transparent;font:700 14px/1 var(--font)}
.rck .ck svg{width:10px;height:10px}
.rck input:checked+.ck{background:var(--green);border-color:var(--green);color:#fff}
.rck .ck.mix{background:var(--green);border-color:var(--green);color:#fff}
.rck.dis{cursor:not-allowed}
.rck input:disabled+.ck{background:var(--bg-soft);border-color:#DADADA;color:transparent}
.colx{border:0;background:transparent;color:var(--ink-4);font-size:16px;line-height:1;width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.colx:hover{background:#FBEDEC;color:var(--red)}
.rpsel{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
.rpsel option:disabled{color:var(--ink-4)}
.rpi{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:8px;vertical-align:middle;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink-3);font:700 12px/1 Georgia,'Times New Roman',serif;font-style:italic;cursor:default}
.rpi:hover{border-color:var(--green);color:var(--green)}
.rpi::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#fff;color:var(--ink-2);border:1px solid var(--line);box-shadow:0 6px 18px rgba(20,22,40,.12);font:500 12px/1.35 var(--font);font-style:normal;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;z-index:40}
.rpi:hover::after{opacity:1;visibility:visible}
.rpall{border:0;background:transparent;color:var(--green);font:500 12px var(--font);padding:0 2px;margin-left:4px;cursor:pointer}
.rpall:hover{text-decoration:underline;text-underline-offset:2px}
.mxfoot{padding:10px 14px;border-top:1px solid var(--line);background:var(--bg-soft);font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pager{display:flex;align-items:center;gap:12px;margin-top:12px}
.pager .grow{flex:1}
.pginfo{font-size:14px;color:var(--ink-3)}
.pgbtn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);padding:0}
.pgbtn:hover:not(:disabled){background:var(--bg-soft)}
.pgbtn:disabled{opacity:.35;cursor:not-allowed}
.pgbtn svg{width:14px;height:14px}
.mxv .emptyh{width:100%}
.mxv td.emptycell{background:var(--bg-soft);border-left:1px dashed var(--line);vertical-align:middle;white-space:normal}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:30px 20px;text-align:center}
.es .et{font-size:16px;font-weight:500;color:var(--ink)}
.es .ed{font-size:14px;color:var(--ink-3);max-width:420px;line-height:1.5;margin-bottom:6px}
/* column control pinned to the right edge, like the platform's actions column */
.mxv .c-cfg{position:sticky;right:0;width:44px;min-width:44px;max-width:44px;padding:0 6px;text-align:center;box-shadow:-1px 0 0 var(--line-2)}
.mxv thead .c-cfg{z-index:3}
.cfgb{width:30px;height:30px;border:0;background:transparent;border-radius:6px;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
.cfgb:hover,.cfgb.on{background:var(--green-soft);color:var(--green)}
.cfgb svg{width:17px;height:17px}
.cpx{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(20,22,40,.16);padding:10px;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 16px)}
.cpx .srch{background:#fff;padding:8px 12px}
.cpb{max-height:min(360px,50vh);overflow:auto}
.cph{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:500;padding:8px 4px 6px}
.cph.sub{font-size:14px;color:var(--ink-3);border-top:1px solid var(--line-2);margin-top:6px;padding-top:10px}
.ci{position:relative;display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:6px;font-size:16px;cursor:pointer;border:1px solid transparent}
.ci:hover{background:var(--bg-soft)}
.ci input{position:absolute;opacity:0;pointer-events:none}
.ci .ck{width:17px;height:17px;border-radius:4px;border:1.5px solid #BDBDBD;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.ci .ck svg{width:11px;height:11px}
.ci.on .ck{background:var(--green);border-color:var(--green);color:#fff}
.ci .cn{flex:1;min-width:0}
.ci .ct{font-size:12px;color:var(--ink-4)}
.ci .grip{color:var(--ink-4);cursor:grab;display:flex}
.ci .grip svg{width:14px;height:14px}
.ci.drag{opacity:.45}
.ci.over{border-color:var(--green-line);background:var(--green-soft)}
.cpe{font-size:14px;color:var(--ink-4);padding:6px 8px}
.cpa{width:100%}
/* "Change all" restore point menu */
.fpop{position:fixed;z-index:70;width:320px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(20,22,40,.16);padding:12px;display:flex;flex-direction:column;gap:8px}
.fpop .fph{font-size:16px;font-weight:500}
.fpop .fhint{font-size:12px;color:var(--ink-3);line-height:1.45}
.fpop .rplist{display:flex;flex-direction:column;gap:1px}
.fpop .mi{display:flex;align-items:center;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:16px}
.fpop .mi:hover{background:var(--bg-soft)}
.fpop .mi.cur{color:var(--green);font-weight:500}
.fpop .mi.dis{cursor:default;color:var(--ink-4)}
.fpop .mi.dis:hover{background:transparent}
.fpop .md{font-size:12px;color:var(--ink-3);font-weight:400}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;position:relative;background:#fff}
.card.on{border-color:var(--green);background:var(--green-soft)}
.card.off{opacity:.55;cursor:not-allowed;background:var(--bg-soft)}
.card .rad{position:absolute;top:15px;right:15px;width:15px;height:15px;border-radius:50%;border:1.5px solid #BDBDBD;background:#fff}
.card.on .rad{border:4.5px solid var(--green)}
.card .ct{font-weight:500;font-size:16px;margin-bottom:3px;padding-right:22px}
.card.on .ct{color:var(--green)}
.card .cd{font-size:14px;color:var(--ink-2);line-height:1.5;padding-right:14px}
.callout{display:flex;gap:11px;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--radius);padding:13px 15px;font-size:14px;color:var(--ink-2);line-height:1.55}
.callout svg{width:16px;height:16px;flex-shrink:0;color:var(--ink-3);margin-top:1px}
.callout b{color:var(--ink)}
.callout.warn{border-color:var(--amber-line);background:var(--amber-soft)}
.ack{display:flex;gap:11px;align-items:flex-start;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;font-size:16px;line-height:1.5;position:relative}
.ack:hover{border-color:#C9C9C9}
.ack.on{border-color:var(--green);background:var(--green-soft)}
.ack input{position:absolute;opacity:0;pointer-events:none}
.ack .ck{width:17px;height:17px;border-radius:4px;border:1.5px solid #BDBDBD;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px}
.ack .ck svg{width:11px;height:11px}
.ack.on .ck{background:var(--green);border-color:var(--green);color:#fff}
.sum{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.srow{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.srow:last-child{border-bottom:0}
.srow .si{width:20px;color:var(--ink-3);flex-shrink:0;margin-top:1px;display:flex}
.srow .si svg{width:18px;height:18px}
.srow .sk{font-size:14px;color:var(--ink-3);margin-bottom:2px}
.srow .sv{font-size:16px;font-weight:500}
.srow .sv.reg{font-weight:500}
.srow .sub{color:var(--ink-3);font-size:14px;margin-top:2px;font-weight:500}
.expand{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);margin-top:12px;cursor:pointer;font-size:16px;font-weight:500}
.expand:hover{background:var(--bg-soft)}
.expand .car{color:var(--ink-3);transition:.15s;display:flex}
.expand.open .car{transform:rotate(90deg)}
.exbody{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);margin-top:-1px;max-height:300px;overflow:auto}
.exbody .eitem{padding:10px 16px;border-bottom:1px solid var(--line-2);font-size:16px;display:flex;gap:10px;align-items:center}
.exbody .eitem:last-child{border-bottom:0}
.exbody .eitem .g{color:var(--ink-3)}

/* ---- the job, simulated. Records are written parents first; files of written records follow as their own phase. ---- */
const fileRefusal=f=>{const e=ext(f.name);
  if(BLOCKED_NOW.includes(e))return {why:`File type .${e} is blocked by the environment.`,fix:'Allow the extension in the environment settings, then re-run.'};
  if(f.kb>MAX_UPLOAD_MB*1024)return {why:`The file is ${fmt(f.kb)}; the environment accepts up to ${MAX_UPLOAD_MB} MB.`,fix:'Raise the maximum upload size in the environment settings, then re-run.'};
  return null;};
/* the backup says what the record was; whether it exists now is found out only when the job writes it */
function nowExists(n,parentRes,rootMissing){
  if(!parentRes)return {exists:!!(n.back||!(n.del||n.gone)),inBin:n.inBin};
  if(rootMissing)return {exists:false,inBin:rnd(n.id,40)<.8};
  return {exists:rnd(n.id,41)>.12,inBin:rnd(n.id,42)<.7};
}
function decide(n,parentRes,rootMissing){
  if(parentRes&&(parentRes.o==='fl'||parentRes.blocked)){const fn=parentRes.blocked?parentRes.failedName:parentRes.name;
    return {o:'sk',attn:true,blocked:true,failedName:fn,why:`Not attempted — ${fn} above it failed.`};}
  const {exists,inBin}=nowExists(n,parentRes,rootMissing);
  if(n.type==='annotation'&&!parentRes&&n.parentGone&&!exists)
    return st.hier?(inBin?{o:'cr',src:'bin',why:`Restored from the recycle bin after parent hierarchy brought back its Regarding record ${n.acct}.`}
        :{o:'cr',src:'bk',why:`Re-created after parent hierarchy brought back its Regarding record ${n.acct}.`})
      :{o:'sk',attn:true,why:`The Regarding record ${n.acct} does not exist in the environment.`,fix:'Restore the account first, or turn on Restore records hierarchy to bring it back as a parent.'};
  if(parentRes&&exists){
    if(kidSame(n))return {o:'sk',why:'Exists in the environment and matches the backup — nothing to update.'};
    if(st.crule==='none')return {o:'sk',why:'Exists in the environment — not updated (records restore rule).'};
    if(st.crule==='lookup'&&kidLookup(n))return {o:'sk',why:'Exists, and its parent lookup already matches the backup.'};
  }else if(exists&&st.mode==='skip')return {o:'sk',why:'Exists in the environment — left as it is.'};
  if(n.fail)return {o:'fl',src:'Dynamics 365',code:'-2147220891',msg:'Account number must be unique.',why:'Rejected by the environment: “Account number must be unique.” (plug-in AccountNumberValidator)',fix:'Resolve the duplicate account number, then re-run.'};
  if(n.parent&&rnd(n.id,44)<.006)return {o:'fl',src:'Dynamics 365',code:'-2147220989',msg:'The status reason is not valid for this record.',why:'Rejected by the environment: “The status reason is not valid for this record.”',fix:'Check the status configuration, then re-run.'};
  const f=(n.type==='annotation')?(n.file||(n.f&&n.f.file)):null;
  if(f){const rf=fileRefusal(f);if(rf)return {o:'fl',src:'Dynamics 365',code:'-2147205623',msg:rf.why,why:`${rf.why} The note was ${exists?'not updated':'not created'}.`,fix:rf.fix};}
  if(exists)return {o:'ow',why:!parentRes?'Returned to its state at the restore point.':st.crule==='lookup'?'Parent lookup returned to its value at the restore point.'
    :st.crule==='all'?'Fields returned to their values at the restore point; empty values not written.':'Returned to its state at the restore point, including empty values.'};
  return inBin?{o:'cr',src:'bin',why:'Restored from the recycle bin, then updated from the backup.'}:{o:'cr',src:'bk',why:'Re-created from the backup with the same id.'};
}
/* each record once, at its shortest depth; children inherit the root's restore point */
function traverse(roots,depth,excl){
  let lvl=roots.map(r=>{const e={n:r,lvl:0,parent:null};e.rootE=e;return e;});
  const all=[];
  while(lvl.length){
    const nx=[];
    lvl.forEach(x=>{all.push(x);
      if(x.lvl<depth)kidsOf(x.n).forEach(g=>{if(excl.has(g.type))return;g.recs.forEach(c=>nx.push({n:c,lvl:x.lvl+1,parent:x,rootE:x.rootE}));});});
    lvl=nx;
  }
  return all;
}
/* child records of the selected records within the depth, by type; an excluded type gets the count it would have */
function childCounts(){
  const roots=selRows(), by={};
  traverse(roots,st.depth,st.excl).forEach(x=>{if(x.lvl)by[x.n.type]=(by[x.n.type]||0)+1;});
  const would={};[...st.excl].forEach(t=>{const ex=new Set(st.excl);ex.delete(t);
    would[t]=traverse(roots,st.depth,ex).filter(x=>x.lvl&&x.n.type===t).length;});
  return {by,would,total:Object.values(by).reduce((a,b)=>a+b,0)};
}
function runJob(){
  const roots=selRows(), recs=[], files=[];
  const withKids=st.hier&&hierAvail();
  let order=0;
  /* traversal level by level; children inherit the root's restore point; the validation rule stops the descent below an existing record */
  const depth=withKids?st.depth:0, all=[];
  let lvl=roots.map(r=>{const e={n:r,lvl:0,parent:null};e.rootE=e;return e;});
  while(lvl.length){const nx=[];
    lvl.forEach(x=>{const res=decide(x.n,x.parent&&x.parent.res,x.parent?x.rootE.missing:false);
      if(!x.parent)x.missing=res.o==='cr';
      x.res={...res,name:x.n.name,ex:nowExists(x.n,x.parent&&x.parent.res,x.parent?x.rootE.missing:false).exists};
      let down=x.lvl<depth;
      if(down&&stopHere(x)){down=false;x.res.why+=` Deeper levels were not checked: ${STOPWHY[st.vrule]}.`;}
      all.push(x);
      if(down)kidsOf(x.n).forEach(g=>{if(st.excl.has(g.type))return;g.recs.forEach(c=>nx.push({n:c,lvl:x.lvl+1,parent:x,rootE:x.rootE}));});});
    lvl=nx;}
  all.forEach(x=>recs.push({kind:'rec',n:x.n,lvl:x.lvl,obj:OT[x.n.type].s,parentName:x.parent?x.parent.n.name:null,rp:st.recRP[x.rootE.n.id],ord:order++,...x.res}));
  /* display order: each root followed by its tree */
  const byParent=new Map();all.forEach(x=>{const k=x.parent?x.parent.n.id:'';if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(x);});
  let d=0;const ix=new Map();(function walk(k){(byParent.get(k)||[]).forEach(x=>{ix.set(x.n.id,d++);walk(x.n.id);});})('');
  recs.forEach(r=>r.dfs=ix.get(r.n.id));
  /* files carried by file columns of written records */
  if(OBJ.key==='account')recs.forEach(r=>{if(r.lvl===0&&(r.o==='cr'||r.o==='ow'))OBJ.fields.filter(c=>c.fam==='file').forEach(c=>{const f=r.n.f[c.k];if(!f)return;const rf=fileRefusal(f);
    files.push({kind:'file',n:r.n,lvl:0,col:c.n,f,o:rf?'fl':'ok',why:rf?rf.why:null,fix:rf?rf.fix:null,src:rf?'Dynamics 365':'',code:rf?'-2147205623':'',msg:rf?rf.why:'',dfs:r.dfs});});});
  return [...recs,...files];
}

/* fields mode: every chosen value of every record is written; the job reads the current value first, so a value
   that already holds the restored one is not rewritten. Files of the chosen file columns follow as their own phase. */
function runFields(){
  const F=FK(), recs=rfRows(), vf=RFS().filter(k=>F[k].fam!=='file'), ff=RFS().filter(k=>F[k].fam==='file'), R=[];
  recs.forEach(r=>{
    if(r.gone){R.push({kind:'val',r,f:null,o:'sk',why:'The record no longer exists in the environment — restore it whole.'});return;}
    vf.forEach(k=>{const x=rnd(r.id+'|'+k,71);let o=x<.5?'same':'ok',src='',code='',msg='';
      if(o==='ok'&&k==='owner'&&rnd(r.id,72)<.12){o='fail';src='Dynamics 365';code='-2147220891';msg='The owner belongs to a different business unit than the account.';}
      R.push({kind:'val',r,f:k,v:fieldAt(r,k),o,src,code,msg});});
  });
  recs.filter(r=>!r.gone).forEach(r=>ff.forEach(k=>{const f=fieldAt(r,k);if(!f)return;const rf=fileRefusal(f);
    R.push({kind:'vfile',r,f:k,file:f,o:rf?'fail':'ok',src:rf?'Dynamics 365':'',code:rf?'-2147205623':'',msg:rf?rf.why:''});}));
  R.fv=true;R.fi=FIM();return R;
}
function runFieldsExport(){
  const F=FK(), list=rfRows().slice().sort((a,b)=>a.name.localeCompare(b.name));
  const rows=[[`${OBJ.s} ID`,OBJ.s,'Restore point',...RFS().map(k=>F[k].n)],
    ...list.map(r=>[guidOf(r.id),r.name,rpLabel(st.recRP[r.id]),...RFS().map(k=>{const v=fieldAt(r,k);return F[k].fam==='file'?(v?v.name:''):(v??'');})])];
  const text=rows.map(x=>x.map(csvCell).join(',')).join('\r\n')+'\r\n';
  const R=list.map(r=>({kind:'exp',n:r,rp:st.recRP[r.id],o:'ok'}));
  R.file={name:expName(),text,bytes:new Blob(['\ufeff'+text]).size,nf:RFS().length,fv:true};R.fv=true;
  return R;
}
function fvTally(R){const v=R.filter(x=>x.kind==='val'&&x.f),fi=R.filter(x=>x.kind==='vfile');
  return {ok:v.filter(x=>x.o==='ok').length,same:v.filter(x=>x.o==='same').length,fail:v.filter(x=>x.o==='fail').length,

/* ---- results: the session report in Activity ----
   The session sums up the job per level, object type and operation; the outcome of every record goes to the exported results. */
const LOGICAL={account:'account',contact:'contact',opportunity:'opportunity',incident:'incident',activity:'activitypointer',annotation:'annotation',quote:'quote',
  opportunityproduct:'opportunityproduct',quotedetail:'quotedetail',activitymimeattachment:'activitymimeattachment'};
const logicalOf=t=>LOGICAL[t]||t;
/* restored: created, overwritten, or already as needed; skipped: not attempted (its parent failed) or left out with a reason */
const isOk=x=>x.o==='cr'||x.o==='ow'||x.o==='ok'||(x.o==='sk'&&!x.attn&&!x.blocked);
const isSk=x=>x.o==='sk'&&(x.attn||x.blocked);
function tally(R){const rec=R.filter(x=>x.kind==='rec'),fil=R.filter(x=>x.kind==='file');
  return {ok:rec.filter(isOk).length,fl:rec.filter(x=>x.o==='fl').length,sk:rec.filter(isSk).length,bin:rec.filter(x=>x.src==='bin').length,
    fok:fil.filter(x=>x.o==='ok').length,ffl:fil.filter(x=>x.o==='fl').length};}
const hms=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function sessionLog(R,s){
  const fin=!!s.finished, t0=s.started.getTime(), L=[];let k=0;
  const at=()=>hms(new Date(t0+(k++)*1300));
  const rn=n=>`${n} record${s1(n)}`;
  L.push({k:'info',t:at(),m:s.head});
  const rec=R.filter(x=>x.kind==='rec'), lv=[...new Set(rec.map(x=>x.lvl))].sort((a,b)=>a-b);
  lv.forEach(l=>{
    const at_l=rec.filter(x=>x.lvl===l), objs=[...new Set(at_l.map(x=>x.obj))];
    objs.forEach(o=>{
      const g=at_l.filter(x=>x.obj===o);
      const same=x=>x.o==='sk'&&!x.attn&&!x.blocked;
      [['Creating',x=>!x.ex],['Updating',x=>x.ex]].forEach(([op,f])=>{
        const h=g.filter(x=>f(x)&&!isSk(x)&&!same(x));if(!h.length)return;
        const ok=h.filter(isOk).length,fl=h.filter(x=>x.o==='fl').length;
        L.push({k:fl?'warn':'ok',t:at(),m:`${op} ${o} at level ${l}: ${rn(ok)} successfully restored, ${rn(fl)} failed`});
        h.filter(x=>x.o==='fl').forEach(x=>L.push({k:'fail',t:at(),
          m:`Failed ${o} “${x.n.name}” at level ${l} with ${x.src||'Veeam'} error code: ${x.code||'—'} and error message: ${String(x.msg||x.why).replace(/\.$/,'')}${s.hier&&l<s.depth?'. Related tree is skipped':''}`}));
      });
      const nu=g.filter(same).length;
      if(nu)L.push({k:'ok',t:at(),m:`Checking ${o} at level ${l}: ${rn(nu)} already in the environment, no update needed`});
      const why=new Map();g.filter(x=>isSk(x)&&!x.blocked).forEach(x=>why.set(x.why,(why.get(x.why)||0)+1));
      why.forEach((n,w)=>L.push({k:'warn',t:at(),m:`Skipped ${o} at level ${l}: ${rn(n)} — ${w}`}));
      const bl=g.filter(x=>x.blocked).length;
      if(bl)L.push({k:'warn',t:at(),m:`Skipped ${o} at level ${l}: ${rn(bl)} — related tree of a failed record`});
    });
  });
  const fil=R.filter(x=>x.kind==='file');
  if(fil.length){const ok=fil.filter(x=>x.o==='ok').length,fl=fil.length-ok;
    L.push({k:fl?'warn':'ok',t:at(),m:`Restoring files of ${OBJ.s} at level 0: ${ok} file${s1(ok)} successfully restored, ${fl} file${s1(fl)} failed`});
    fil.filter(x=>x.o==='fl').forEach(x=>L.push({k:'fail',t:at(),m:`Failed file ${x.f.name} of ${OBJ.s} “${x.n.name}” with ${x.src} error code: ${x.code} and error message: ${String(x.msg).replace(/\.$/,'')}`}));}
  if(fin){const t=tally(R);L.push({k:t.fl?'warn':'ok',t:hms(s.finished),m:`Restore completed. ${rn(t.ok)} successfully restored, ${rn(t.fl)} failed${t.sk?`, ${rn(t.sk)} skipped`:''}.`});}
  return L;
}

function statusChip(status,pct){return `<span class="schip ${status}">${status==='run'?'<span class="spin"></span>':''}${STATUS_TXT[status]}${status==='run'&&pct!=null?` · ${pct}%`:''}</span>`;}
function ownerCell(sys){return sys?'<span class="av sys">SY</span>System':`<span class="av">${OWNER.ini}</span>${OWNER.mail}`;}

function startSession(R,settings){
  const s={id:'s'+(SESSIONS.length+1),name:PLAT.procName(),sub:PLAT.procSub(R),R,done:0,total:R.length,
           started:new Date(),finished:null,settings,rf:'attn',setOpen:false,
           dest:PLAT.destLabel?PLAT.destLabel():'Source environment',noun:PLAT.noun?PLAT.noun():'Restore',
           head:PLAT.head?PLAT.head(R):'',hier:st.hier&&hierAvail(),depth:st.depth};
  SESSIONS.unshift(s);
  /* about 20 seconds end to end in the prototype — stands in for a long job */
  const step=Math.max(1,Math.ceil(s.total/45));
  s.timer=setInterval(()=>{
    s.done=Math.min(s.total,s.done+step);
    if(s.done>=s.total){clearInterval(s.timer);s.finished=new Date();s.rf=PLAT.issues(s.R)?'attn':'all';}
    if(scr!=='wizard')renderPlat();
    else if(st.started===s.id){if(s.finished)render();else ovLive(s);}
  },450);
  return s;
}

function captureSettings(){
  const sum0=$('#view').querySelector('.sum'),sum=sum0&&sum0.cloneNode(true);
  if(sum){const f=sum.querySelector('#fList');if(f){f.removeAttribute('id');f.classList.remove('one');f.textContent=RFS().map(k=>FK()[k].n).join(', ');}}
  let h=(sum?sum.outerHTML:'<div class="sum"></div>').replace(' — see the list below','');
  const extra=[(!PLAT.automationRow||PLAT.automationRow())?['Automation in the environment','Not turned off by the restore — stated on the Summary step']:null].filter(Boolean);
  return h.replace(/<\/div>\s*$/,extra.map(([k,v])=>`<div class="srow"><span class="si">${I.info}</span><div><div class="sk">${k}</div><div class="sv reg">${v}</div></div></div>`).join('')+'</div>');
}

function ovJob(s){
  const fin=!!s.finished, w=fin&&PLAT.issues(s.R), R=s.R.slice(0,s.done), exp=isExp(s);
  const ic=!fin?'<span class="ovi"><span class="spin"></span></span>':w?'<span class="ovi warn">!</span>':`<span class="ovi ok">${I.check}</span>`;
  let d;
  if(!fin)d=`${PLAT.progLabel(s)} · ${pctOf(s)}%<div class="pbarw"><i style="width:${pctOf(s)}%"></i></div>`;
  else if(exp)d=`Finished ${fmtWhen(s.finished)} · ${dur(s.started,s.finished)} — <b>${R.length}</b> record${s1(R.length)} in ${esc(s.R.file.name)} · ${fmtBytes(s.R.file.bytes)}`;
  else if(s.R.fi){const n=fvTally(R);d=`Finished ${fmtWhen(s.finished)} · ${dur(s.started,s.finished)} — <b>${n.fok}</b> file${s1(n.fok)} restored, ${n.ffl} failed${n.sk?`, ${n.sk} record${s1(n.sk)} skipped`:''}`;}
  else if(s.R.fv){const n=fvTally(R);d=`Finished ${fmtWhen(s.finished)} · ${dur(s.started,s.finished)} — <b>${n.ok}</b> value${s1(n.ok)} written, ${n.same} already correct, ${n.fail} failed${n.sk?`, ${n.sk} record${s1(n.sk)} skipped`:''}${n.fok+n.ffl?` · files: ${n.fok} restored${n.ffl?`, ${n.ffl} failed`:''}`:''}`;}
  else{const n=tally(R);d=`Finished ${fmtWhen(s.finished)} · ${dur(s.started,s.finished)} — <b>${n.ok}</b> record${s1(n.ok)} restored, ${n.fl} failed${n.sk?`, ${n.sk} skipped`:''}${n.fok+n.ffl?` · files: ${n.fok} restored${n.ffl?`, ${n.ffl} failed`:''}`:''}`;}
  return `${ic}<div class="ovb"><div class="ovk">${s.noun} job</div><div class="ovd">${d}</div></div>

function renderPlat(){
  const P=$('#plat'), m=P.querySelector('.pmain'), rs=P.querySelector('.rs');
  const keep=lastScr===scr+'|'+openSid, sy=keep&&m?m.scrollTop:0, ry=keep&&rs?rs.scrollTop:0;
  const body=scr==='protected'?pageProtected():scr==='sessions'?pageSessions():pageSession();
  P.innerHTML=`<div class="pmain">${body}</div>`;
  P.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>showPlat(b.dataset.nav));
  P.querySelectorAll('[data-sid]').forEach(a=>a.onclick=e=>{e.preventDefault();openSession(a.dataset.sid);});
  P.querySelectorAll('[data-crumb]').forEach(a=>a.onclick=e=>{e.preventDefault();showPlat(a.dataset.crumb);});
  const w=$('#toWizard');if(w)w.onclick=()=>{if(st.started)PLAT.reset();showWizard();};
  const ss=$('#sessState');if(ss)ss.onchange=e=>{sessState=e.target.value;renderPlat();};
  if(scr==='session'){const s=SESSIONS.find(x=>x.id===openSid);
    if(s){PLAT.bind(P,s.R.slice(0,s.done),s);const d=$('#pset');if(d)d.ontoggle=()=>{s.setOpen=d.open;};}}
  const m2=P.querySelector('.pmain'), rs2=P.querySelector('.rs');if(m2)m2.scrollTop=sy;if(rs2)rs2.scrollTop=ry;
  lastScr=scr+'|'+openSid;

NV.dd='<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.83333 7.91667L10 12.0833L14.1667 7.91667H5.83333Z" fill="currentColor"/></svg>';
const CRUMBS=items=>`<div class="crumb">${NV.home}<span class="cv">${NV.chev}</span>${items.map(([t,c])=>(c?`<a href="#" data-crumb="${c}">${t}</a>`:`<span>${t}</span>`)+`<span class="cv">${NV.chev}</span>`).join('')}</div>`;
/* the platform's side navigation (DCP Figma); Protected Data and Activity are the two live entries */
const NAV=[['dash'],['inv','protected','Protected Data'],['sbr'],['graph'],['agent'],['pol'],['find'],['act','sessions','Activity'],['integ'],['sett'],['dns'],['help']];
function renderNav(){
  const on=(scr==='sessions'||scr==='session')?'sessions':'protected';
  $('#snav').innerHTML=`<div class="lg">${NV.veeam}</div><div class="na"><div class="mn"><span class="mm" aria-hidden="true">${NV.more}</span>
    <div class="it">${NAV.map(([k,nav,t])=>`<button class="nb ${nav===on?'on':''}" ${nav?`data-nav="${nav}" title="${t}"`:'tabindex="-1" aria-hidden="true"'}>${NV[k]}</button>`).join('')}</div></div>
    <span class="avt" title="${OWNER.mail}">${OWNER.ini}</span></div>`;
  $('#snav').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>scr==='wizard'?leaveWizard(b.dataset.nav):showPlat(b.dataset.nav));
}
function renderProto(){
  $('#protobar').innerHTML=`<span class="pbl">Prototype</span><span>Unified restore wizard</span>
    <span class="pbg"></span><span>Object</span>
    <span class="pbs">${[['account',0,'Accounts'],['account',1,'Accounts (120)'],['annotation',0,'Notes']].map(([o,bg,t])=>`<button data-proto="${o}" data-big="${bg}" class="${OBJ.key===o&&!!OBJ.big===!!bg?'on':''}" ${bg?`title="More than ${SAMPLE_LIMIT} records: Restore records hierarchy stays disabled"`:''}>${t}</button>`).join('')}</span>`;
  $('#protobar').querySelectorAll('[data-proto]').forEach(b=>b.onclick=()=>{const bg=+b.dataset.big;if(b.dataset.proto===OBJ.key&&!!OBJ.big===!!bg&&scr==='wizard')return;
    closePops();const w=st.what;reset(b.dataset.proto,bg);st.what=fieldsOK()?w:'records';renderProto();if(scr!=='wizard')showWizard();else render();
    toast(`${OBJ.big?`${OBJ.rows.length} ${OBJ.p.toLowerCase()}`:OBJ.p} — the prototype starts over.`,'Prototype');});
}
{$('#hdrTile').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v4.5H8"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>';$('#hdrClose').innerHTML=NV.close;const c=$('#hdrClose');if(c)c.onclick=()=>leaveWizard('protected');
 {const W=$('#wCrumb');W.innerHTML=`<a href="#" class="hm" data-wc="protected" aria-label="Home">${NV.home}</a><span class="cv">${NV.chev}</span><a href="#" data-wc="protected">Protected Data</a><span class="cv">${NV.chev}</span><a href="#" data-wc="protected">Dynamics 365</a><span class="cv">${NV.chev}</span><span aria-current="page">ACME Inc</span>`;
  W.querySelectorAll('[data-wc]').forEach(a=>a.onclick=e=>{e.preventDefault();leaveWizard(a.dataset.wc);});}
 const hc=$('#hdrCrumb');if(hc)hc.onclick=e=>{e.preventDefault();leaveWizard('protected');};}


let rsz;
window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{closePops();if(!st.started&&STEPS[st.i].k==='records'){fitNof();fitRows();}},120);});
$('.main').addEventListener('scroll',()=>{if(fx||rpm||cp)closePops();});
document.body.classList.add('br-'+BRANCH);
/* Headings use Title Case across the product: every heading, label, column and section title is normalised as it renders */
const TC_MINOR=new Set(['a','an','the','and','or','nor','but','of','on','in','to','for','by','at','from','with','as','per','vs','via','into']);
function tcStr(t){const w=t.split(' '),last=w.length-1;return w.map((x,i)=>{const b=x.replace(/[.,:;?!)]+$/,'').replace(/^\(/,'');
  if(!b||/[-_.\/@\\\d]/.test(b))return x; if(i>0&&i<last&&TC_MINOR.has(b))return x;
  const k=x.search(/[a-z]/i);return k<0?x:x.slice(0,k)+x[k].toUpperCase()+x.slice(k+1);}).join(' ');}
const TC_SEL='#hdrTitle,h1,h2,h3,h4,#rail .lbl,#rail .txt,.et,.srow .sk,.k,.lgh,.ovk,.nxh,.hsh,.ht,.fph,.fpx-lh,.ot,.cs-k,.cx-vh,th,summary,.frow>label,#toast>b,.cph>span,.cph.sub,button:not(.lk):not(.pgi):not(.nxi):not(#protobar *),.nxk';
function tcApply(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const v=tcStr(n.data);if(v!==n.data)n.data=v;}}
function tcScan(root){const a=root.closest&&root.closest(TC_SEL);if(a){tcApply(a);return;}if(root.querySelectorAll)root.querySelectorAll(TC_SEL).forEach(tcApply);}
new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(x=>{const h=x.nodeType===1?x:x.parentElement;if(h)tcScan(h);});}).observe(document.body,{childList:true,subtree:true});
tcScan(document.body);
renderNav();
renderProto();
render();
</script>
